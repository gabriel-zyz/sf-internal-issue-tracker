<template>
    <lightning-card title="All Reported Issues">
        <div class="slds-p-around_medium">
            <lightning-combobox
                name="statusFilter"
                label="Filter by Status"
                value={statusFilter}
                placeholder="All"
                options={statusOptions}
                onchange={handleStatusFilterChange}>
            </lightning-combobox>

            <lightning-combobox
                name="priorityFilter"
                label="Filter by Priority"
                value={priorityFilter}
                placeholder="All"
                options={priorityOptions}
                onchange={handlePriorityFilterChange}>
            </lightning-combobox>
        </div>
        <template if:true={filteredIssues}>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Priority</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={filteredIssues} for:item="issue">
                        <tr key={issue.Id}>
                            <td>{issue.Name}</td>
                            <td>{issue.Description__c}</td>
                            <td>{issue.Status__c}</td>
                            <td>{issue.Priority__c}</td>
                            <td>
                                <lightning-button variant="brand-outline" label="Edit" title="Edit" onclick={handleEdit} data-id={issue.Id} class="slds-m-right_small"></lightning-button>
                                <lightning-button variant="destructive" label="Delete" title="Delete" onclick={handleDelete} data-id={issue.Id}></lightning-button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <template if:true={isModalOpen}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">Edit Issue</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-input label="Title" value={selectedIssue.Name} onchange={handleFieldChange} data-field="Name"></lightning-input>
                            <lightning-textarea label="Description" value={selectedIssue.Description__c} onchange={handleFieldChange} data-field="Description__c"></lightning-textarea>
                            <lightning-combobox label="Status" value={selectedIssue.Status__c} options={statusOptions} onchange={handleFieldChange} data-field="Status__c"></lightning-combobox>
                            <lightning-combobox label="Priority" value={selectedIssue.Priority__c} options={priorityOptions} onchange={handleFieldChange} data-field="Priority__c"></lightning-combobox>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                            <lightning-button variant="brand" label="Save" onclick={handleSave}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </template>
        <template if:true={wiredIssuesResult.error}>
            <p class="slds-text-color_error">Error loading issues</p>
        </template>
    </lightning-card>
</template>
